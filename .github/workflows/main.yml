<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06131d">
<title>J.A.R.V.I.S.</title>

<style>
:root {
  color-scheme: dark;
  --cyan: #42e8ff;
  --bg: #06131d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(
    ellipse at center,
    #10364a 0,
    #06131d 55%,
    #02080d 100%
  );
  color: #d9faff;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.app {
  width: min(100%, 620px);
  text-align: center;
}

h1 {
  font-size: clamp(2rem, 8vw, 3.5rem);
  letter-spacing: .22em;
  color: var(--cyan);
  text-shadow: 0 0 18px #168bba;
  margin: 8px 0;
}

.subtitle {
  letter-spacing: .16em;
  color: #80bdca;
  font-size: .75rem;
  margin-bottom: 24px;
}

.orb {
  width: clamp(150px, 45vw, 220px);
  aspect-ratio: 1;
  margin: 20px auto 26px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  box-shadow: 0 0 18px #168bba, inset 0 0 25px #168bba;
  display: grid;
  place-items: center;
  position: relative;
  background: radial-gradient(
    circle,
    #1c6b82 0,
    #0b2635 48%,
    #06131d 72%
  );
  animation: pulse 3s infinite;
}

.orb::before,
.orb::after {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px solid #42e8ff88;
  border-radius: 50%;
  transform: rotateX(65deg) rotate(20deg);
}

.orb::after {
  inset: 25px;
  transform: rotateX(65deg) rotate(-35deg);
}

.orb span {
  font-size: 2.5rem;
  color: var(--cyan);
  text-shadow: 0 0 15px var(--cyan);
  z-index: 1;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 32px #168bba, inset 0 0 36px #168bba;
  }
}

.status {
  min-height: 24px;
  color: var(--cyan);
  margin: 10px 0;
}

.panel {
  background: #071923cc;
  border: 1px solid #168bba;
  border-radius: 14px;
  padding: 16px;
  text-align: left;
  box-shadow: 0 0 20px #001018;
  margin: 18px 0;
}

.label {
  font-size: .75rem;
  color: #6fb4c5;
  letter-spacing: .12em;
  margin-bottom: 8px;
}

#answer {
  white-space: pre-wrap;
  line-height: 1.5;
  min-height: 44px;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 18px 0;
}

button {
  border: 1px solid var(--cyan);
  border-radius: 9px;
  background: #0b3040;
  color: #e5fcff;
  padding: 12px 16px;
  font-weight: bold;
  font-size: .95rem;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

button.primary {
  background: #087ca0;
}

.inputrow {
  display: flex;
  gap: 8px;
}

input {
  min-width: 0;
  flex: 1;
  border: 1px solid #24718a;
  background: #06131d;
  color: white;
  border-radius: 9px;
  padding: 12px;
  font-size: 1rem;
}

.note {
  font-size: .8rem;
  line-height: 1.5;
  color: #8cb7c2;
  margin-top: 20px;
}
</style>
</head>

<body>
<main class="app">

  <h1>J.A.R.V.I.S.</h1>

  <div class="subtitle">
    SISTEMA DE ASSISTÊNCIA PESSOAL
  </div>

  <div class="orb" aria-hidden="true">
    <span>J</span>
  </div>

  <div id="status" class="status" role="status">
    Sistema pronto.
  </div>

  <section class="panel">
    <div class="label">RESPOSTA DO JARVIS</div>

    <div id="answer">
      Olá! Sou o JARVIS. Toque em Falar e diga um comando, ou escreva abaixo.
    </div>
  </section>

  <div class="controls">
    <button class="primary" id="listenBtn" type="button">
      🎙️ Falar
    </button>

    <button id="stopBtn" type="button">
      🔇 Parar voz
    </button>

    <button id="testBtn" type="button">
      🔊 Testar voz
    </button>
  </div>

  <form id="commandForm" class="inputrow">
    <input
      id="commandInput"
      type="text"
      placeholder="Digite um comando..."
      autocomplete="off"
      aria-label="Comando"
    >

    <button class="primary" type="submit">
      Enviar
    </button>
  </form>

  <p class="note">
    O reconhecimento de voz depende do navegador e da permissão do microfone.
    No Android, tente usar o Chrome e permita o microfone.
    A escuta pode precisar ser iniciada novamente após cada comando.
  </p>

</main>

<script>
(() => {
  "use strict";

  const statusEl = document.getElementById("status");
  const answerEl = document.getElementById("answer");
  const listenBtn = document.getElementById("listenBtn");
  const stopBtn = document.getElementById("stopBtn");
  const testBtn = document.getElementById("testBtn");
  const form = document.getElementById("commandForm");
  const input = document.getElementById("command<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<title>Jarvis</title>
<style>
:root{
  --bg:#0a1120;--fg:#e8edf4;--muted:#8593a8;--card:#131d30;--border:#24314a;
  --input:#0f1829;--primary:#0e7490;--sec:#1a2740;--cyan:#22d3ee;--gold:#fbbf24;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px}
.title{font-size:15px;font-weight:500;letter-spacing:.6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:7px;vertical-align:1px}
.dot.busy{background:#f59e0b}
.corewrap{width:190px;height:190px;margin:0 auto 12px}
canvas{width:100%;height:100%;display:block}
video{display:none}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px}
.caps{display:flex;flex-wrap:wrap;gap:6px;padding:11px 13px;margin-bottom:10px}
.cap{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.cap.on{color:var(--fg);border-color:#3a4c6e}
.cap.no{opacity:.4;text-decoration:line-through}
.log{height:215px;overflow-y:auto;padding:11px 13px;display:flex;flex-direction:column;gap:9px}
.m{font-size:13px;max-width:92%}
.m.u{align-self:flex-end;background:var(--primary);color:#fff;padding:7px 11px;border-radius:12px 12px 3px 12px}
.m.j{align-self:flex-start}
.m.j b{font-weight:500;color:var(--cyan);display:block;font-size:11px;letter-spacing:.4px;margin-bottom:2px}
.m.s{align-self:center;color:var(--muted);font-size:11px;text-align:center}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:12px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
.bar{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 13px;border-radius:12px;
  border:1px solid var(--border);background:var(--input);color:var(--fg);outline:none}
input:focus{border-color:#3a4c6e}
button.act{min-width:50px;min-height:46px;border-radius:12px;border:1px solid var(--border);
  background:var(--sec);color:var(--fg);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
button.act.primary{background:var(--primary);color:#fff;border-color:transparent}
button.act.live{background:#ef4444;color:#fff;border-color:transparent}
.note{color:var(--muted);font-size:11px;text-align:center;padding:10px 4px 0;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="hd">
    <div class="title"><span class="dot" id="dot"></span>Jarvis</div>
    <button class="act" id="inst" style="min-height:32px;padding:0 11px;font-size:12px">instalar</button>
  </div>
  <div class="corewrap"><canvas id="core"></canvas></div>
  <video id="cam" playsinline muted></video>
  <div class="panel caps" id="caps"></div>
  <div class="panel log" id="log"></div>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <input id="in" placeholder="Escribe o pulsa el micro..." autocomplete="off" enterkeyhint="send">
    <button class="act" id="micb" aria-label="Hablar">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
    </button>
    <button class="act primary" id="send">Ir</button>
  </div>
  <div class="note" id="note"></div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id),log=$('log'),inp=$('in');
  const S={voice:true,listening:false,speaking:false,notes:[],timers:[],stream:null,track:null,
    torch:false,wake:null,lat:null,lon:null,rec:null,data:null,analyser:null,amp:.05};
  try{S.notes=JSON.parse(localStorage.getItem('jv.notes')||'[]')}catch(e){S.notes=[]}

  const icon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0a1120"/><circle cx="256" cy="256" r="150" fill="none" stroke="#22d3ee" stroke-width="14"/><circle cx="256" cy="256" r="86" fill="#22d3ee"/><circle cx="256" cy="256" r="186" fill="none" stroke="#fbbf24" stroke-width="10" stroke-dasharray="40 30"/></svg>');
  const mani={name:"Jarvis",short_name:"Jarvis",start_url:location.href,scope:"./",
    display:"standalone",background_color:"#0a1120",theme_color:"#0a1120",
    icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  const ml=document.createElement('link');
  ml.rel='manifest';ml.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mani));
  document.head.appendChild(ml);

  function add(t,w){const d=document.createElement('div');d.className='m '+w;
    if(w==='j'){d.innerHTML='<b>JARVIS</b>';d.appendChild(document.createTextNode(t))}else d.textContent=t;
    log.appendChild(d);while(log.children.length>70)log.removeChild(log.firstChild);log.scrollTop=log.scrollHeight}
  function say(t){add(t,'j');if(S.voice)speak(t)}

  let voice=null;const pick=()=>{const v=speechSynthesis.getVoices();
    voice=v.find(x=>/^es/i.test(x.lang)&&/(diego|jorge|juan|pablo|carlos|google)/i.test(x.name))
       ||v.find(x=>/^es/i.test(x.lang))||null};
  if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
  function speak(t){if(!('speechSynthesis' in window))return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*_`#]/g,''));
    u.lang='es-ES';u.rate=1.03;u.pitch=.92;if(voice)u.voice=voice;
    u.onstart=()=>S.speaking=true;u.onend=()=>S.speaking=false;speechSynthesis.speak(u)}catch(e){}}

  const cv=$('core'),ctx=cv.getContext('2d');let W,H;
  function rs(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();
    W=r.width||190;H=r.height||190;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
  addEventListener('resize',rs);
  function draw(ts){const t=(ts||0)/1000;ctx.clearRect(0,0,W,H);
    const cx=W/2,cy=H/2,R=Math.min(W,H)/2-5;
    const tg=S.speaking?.55:S.listening?.3:.06;S.amp+=(tg-S.amp)*.08;const b=S.amp;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.22);ctx.strokeStyle='#22d3ee';ctx.globalAlpha=.5;ctx.lineWidth=1.3;
    for(let i=0;i<36;i++){const a=i/36*Math.PI*2;ctx.beginPath();ctx.arc(0,0,R-4,a,a+.085);ctx.stroke()}ctx.restore();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(-t*.5);ctx.strokeStyle='#fbbf24';ctx.globalAlpha=.85;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,R*.79,0,Math.PI*.42);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,R*.79,Math.PI,Math.PI*1.42);ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(cx,cy);ctx.strokeStyle='#22d3ee';ctx.lineWidth=1.5;
    const N=64,rr=R*.63;ctx.beginPath();
    for(let i=0;i<=N;i++){const a=i/N*Math.PI*2;
      const j=S.data?S.data[i%S.data.length]/255:(Math.sin(t*4+i*.6)*.5+.5)*.6;
      const rad=rr+b*20*j,x=Math.cos(a)*rad,y=Math.sin(a)*rad;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.75);ctx.strokeStyle='#8593a8';ctx.globalAlpha=.5;ctx.lineWidth=1;
    for(let i=0;i<48;i++){const a=i/48*Math.PI*2,l=i%4===0?6:3;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*R*.5,Math.sin(a)*R*.5);
      ctx.lineTo(Math.cos(a)*(R*.5+l),Math.sin(a)*(R*.5+l));ctx.stroke()}ctx.restore();
    const p=1+Math.sin(t*2.4)*.04+b*.22,g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.3*p);
    g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,'rgba(34,211,238,.85)');
    g.addColorStop(1,'rgba(34,211,238,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*.3*p,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#22d3ee';ctx.globalAlpha=.9;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cx,cy,R*.28,0,Math.PI*2);ctx.stroke();
    requestAnimationFrame(draw)}
  function pump(){if(S.analyser&&S.data)S.analyser.getByteFrequencyData(S.data);requestAnimationFrame(pump)}
  async function audio(){if(S.analyser)return true;
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const s=ac.createMediaStreamSource(st);S.analyser=ac.createAnalyser();S.analyser.fftSize=256;
    s.connect(S.analyser);S.data=new Uint8Array(S.analyser.frequencyBinCount);return true}catch(e){return false}}

  const CAPS=[['voz',!!(window.SpeechRecognition||window.webkitSpeechRecognition)],
    ['hablar','speechSynthesis' in window],['cámara',!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)],
    ['contactos',!!(navigator.contacts&&navigator.contacts.select)],['ubicación','geolocation' in navigator],
    ['archivos','FileReader' in window],['compartir',!!navigator.share],['batería',!!navigator.getBattery],
    ['vibración','vibrate' in navigator],['notificaciones','Notification' in window],
    ['portapapeles',!!(navigator.clipboard&&navigator.clipboard.readText)],['pantalla activa','wakeLock' in navigator]];
  CAPS.forEach(c=>{const d=document.createElement('span');d.className='cap '+(c[1]?'on':'no');
    d.textContent=c[0];$('caps').appendChild(d)});

  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;]/g,'').trim();
  const NUMS={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,
    once:11,doce:12,quince:15,veinte:20,veintiuno:21,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,noventa:90,cien:100};
  const toNum=s=>{const d=s.match(/\d+/);if(d)return +d[0];
    const w=s.split(/\s+/).map(x=>NUMS[x]).filter(x=>x!==undefined);
    return w.length?w.reduce((a,b)=>a+b,0):null};

  async function camera(frente){try{
    if(S.stream)S.stream.getTracks().forEach(t=>t.stop());
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:frente?'user':'environment'},audio:false});
    $('cam').srcObject=S.stream;await $('cam').play();S.track=S.stream.getVideoTracks()[0];
    if(navigator.vibrate)navigator.vibrate(30);
    const c=S.track.getCapabilities?S.track.getCapabilities():{};
    return 'Cámara activa'+(c.torch?' con linterna disponible':'')+'.';
  }catch(e){return 'No pude abrir la cámara: '+e.name+'.'}}
  async function torch(on){if(!S.track||!S.stream)await camera(false);if(!S.track)return 'Sin cámara.';
    const c=S.track.getCapabilities?S.track.getCapabilities():{};
    if(!c.torch)return 'Este dispositivo no expone la linterna por web.';
    try{await S.track.applyConstraints({advanced:[{torch:!!on}]});S.torch=!!on;
      return on?'Linterna encendida.':'Linterna apagada.'}catch(e){return 'No pude cambiar la linterna.'}}
  async function contacts(){if(!(navigator.contacts&&navigator.contacts.select))
    return 'Este navegador no da acceso a contactos. Usa Chrome.';
    try{const cs=await navigator.contacts.select(['name','tel'],{multiple:true});
    if(!cs.length)return 'No elegiste ninguno.';
    return 'Contactos: '+cs.map(c=>(c.name&&c.name[0]||'sin nombre')+(c.tel&&c.tel[0]?' ('+c.tel[0]+')':'')).join(', ')+'.';
    }catch(e){return 'Permiso de contactos cancelado.'}}
  function where(){return new Promise(res=>{if(!('geolocation' in navigator))return res('Sin GPS.');
    navigator.geolocation.getCurrentPosition(p=>{S.lat=p.coords.latitude;S.lon=p.coords.longitude;
      res('Estás en '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)+' (precisión '+Math.round(p.coords.accuracy)+' m).')},
      e=>res('No pude localizarte: '+e.message),{enableHighAccuracy:true,timeout:12000})})}
  function readFile(){const i=document.createElement('input');i.type='file';
    i.accept='.txt,.md,.csv,.json,text/*';
    i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{const t=String(r.result).slice(0,400);
        add('Abriendo '+f.name,'s');say('Archivo '+f.name+', '+Math.round(f.size/1024)+' kilobytes. Dice: '+t)};
      r.readAsText(f)};i.click()}
  async function share(t){if(!navigator.share)return 'Este navegador no comparte.';
    try{await navigator.share({text:t,title:'Jarvis'});return 'Compartido.'}catch(e){return 'Compartir cancelado.'}}
  async function wake(){if(!('wakeLock' in navigator))return 'Sin soporte.';
    if(S.wake){await S.wake.release();S.wake=null;return 'La pantalla ya puede apagarse.'}
    S.wake=await navigator.wakeLock.request('screen');return 'Pantalla fija encendida.'}
  function call(n){location.href='tel:'+n.replace(/\D/g,'');return 'Llamando a '+n+'.'}

  const CHISTES=['Un programador fue al mercado. Su mujer le dijo: trae pan y, si hay huevos, trae doce. Volvió con doce barras de pan.',
    'Mi código no tiene errores. Tiene características inesperadas.',
    'La batería de mi portátil dura nueve horas. El problema es que la carga dura dos.',
    'Hay dos tipos de personas: las que entienden la recursividad y las que entienden la recursividad.'];
  const CIU={tokio:'Asia/Tokyo','nueva york':'America/New_York',londres:'Europe/London',paris:'Europe/Paris',
    madrid:'Europe/Madrid',mexico:'America/Mexico_City','buenos aires':'America/Argentina/Buenos_Aires',dubai:'Asia/Dubai'};

  async function handle(raw){const q=norm(raw);if(!q)return;
    const c=q.replace(/^(oye |eh |hola )?(jarvis|jarbis|yarvis)[ ,]*/,'').trim()||q;
    const rep=t=>say(t);
    if(/^(hola|buenas|hey|que tal)\b/.test(c)){const h=new Date().getHours();
      return rep((h<6?'Buenas noches':h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches')+'. Sistemas en línea.')}
    if(/como estas/.test(c))return rep('Operativo, sin incidencias.');
    if(/hora|que horas/.test(c)){const ci=Object.keys(CIU).find(x=>c.includes(x));
      return rep(ci?'En '+ci+' son las '+new Date().toLocaleTimeString('es-ES',{timeZone:CIU[ci],hour:'2-digit',minute:'2-digit'})+'.'
        :'Son las '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'.')}
    if(/fecha|que dia/.test(c))return rep('Hoy es '+new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.');
    if(/contacto/.test(c))return rep(await contacts());
    if(/linterna|flash/.test(c))return rep(await torch(!/apaga|quita|off/.test(c)));
    if(/foto|camara|selfie/.test(c))return rep(await camera(/selfie|frontal/.test(c)));
    if(/donde estoy|ubicacion|mi posicion|gps/.test(c))return rep(await where());
    if(/archivo|documento/.test(c)){readFile();return rep('Elige el archivo.')}
    if(/pantalla (activa|encendida|fija)|que no se apague/.test(c))return rep(await wake());
    if(/^comparte\b/.test(c))return rep(await share(c.replace(/^comparte[ :]*/,'')));
    if(/^llama a\b/.test(c))return rep(call(c.replace(/^llama a[ :]*/,'')));
    if(/temporizador|avisame|alarma/.test(c)){const n=toNum(c),secs=/segund/.test(c)?n:(n?n*60:60);
      if(!secs)return rep('¿Cuánto tiempo?');
      const id=Date.now(),end=Date.now()+secs*1000;
      const iv=setInterval(()=>{if(end-Date.now()<=0){clearInterval(iv);
        S.timers=S.timers.filter(x=>x.id!==id);
        if(navigator.vibrate)navigator.vibrate([200,100,200,100,300]);say('Tiempo cumplido.')}},500);
      S.timers.push({id:id,end:end,iv:iv});if(navigator.vibrate)navigator.vibrate(40);
      return rep('Temporizador de '+(secs>=60?(secs/60)+' minutos':secs+' segundos')+' en marcha.')}
    if(/^(apunta|anota|recuerdame|guarda)\b/.test(c)){
      const t=c.replace(/^(apunta|anota|recuerdame|guarda)( que)?[ :]*/,'').trim();
      if(!t)return rep('¿Qué apunto?');S.notes.push(t);
      localStorage.setItem('jv.notes',JSON.stringify(S.notes));return rep('Anotado: '+t+'.')}
    if(/mis notas|lee.*notas/.test(c)){if(!S.notes.length)return rep('Sin notas.');
      return rep('Tienes '+S.notes.length+': '+S.notes.join('. Luego: ')+'.')}
    if(/borra.*notas/.test(c)){S.notes=[];localStorage.setItem('jv.notes','[]');return rep('Notas borradas.')}
    if(/estado|diagnostico|sistemas/.test(c)){const b=window.__b,n=navigator.connection||{};
      return rep('Todo nominal. '+(b?'Batería '+Math.round(b.level*100)+' por ciento'+(b.charging?' cargando':'')+'. ':'')
        +'Red '+(n.effectiveType||'n/d')+'. '+(S.lat?'Coordenadas fijadas. ':'')+S.notes.length+' notas.')}
    if(/chiste/.test(c))return rep(CHISTES[Math.floor(Math.random()*CHISTES.length)]);
    if(/dado/.test(c))return rep('Ha salido '+(Math.floor(Math.random()*6)+1)+'.');
    if(/moneda|cara o cruz/.test(c))return rep(Math.random()<.5?'Cara.':'Cruz.');
    if(/^(abre|navega a)\b/.test(c)){const d=c.replace(/^(abre|navega a)[ :]*/,'').trim();
      const m={youtube:'https://youtube.com',google:'https://google.com',wikipedia:'https://es.wikipedia.org',
        instagram:'https://instagram.com',spotify:'https://open.spotify.com',whatsapp:'https://web.whatsapp.com'};
      window.open(m[d]||('https://'+d.replace(/\s+/g,'')+'.com'),'_blank');return rep('Abriendo '+d+'.')}
    if(/^(busca|buscar)\b/.test(c)){const x=c.replace(/^(busca|buscar)( en google| en la web)?[ :]*/,'').trim();
      window.open('https://www.google.com/search?q='+encodeURIComponent(x),'_blank');return rep('Buscando '+x+'.')}
    if(/quien eres|que eres/.test(c))return rep('Soy Jarvis. Corro en tu teléfono, sin nube.');
    if(/gracias/.test(c))return rep('A mandar.');
    if(/^(silencio|callate)/.test(c)){S.voice=false;add('Voz silenciada.','s');return}
    if(/^(habla|activa la voz)/.test(c)){S.voice=true;return rep('Voz activada.')}
    const mth=c.replace(/\bmas\b/g,'+').replace(/\bmenos\b/g,'-').replace(/\bpor\b/g,'*')
      .replace(/\bentre\b/g,'/').replace(/\belevado a\b/g,'^').replace(/[^0-9+\-*/^()]/g,'');
    if(mth&&/\d/.test(mth)&&/[+\-*/^]/.test(mth)){try{const v=Function('"use strict";return('+mth+')')();
      if(isFinite(v))return rep('Son '+(Math.round(v*1e4)/1e4)+'.')}catch(e){}}
    const pc=c.match(/(\d+)\s*por ciento de\s*(\d+)/);if(pc)return rep('Son '+(pc[1]*pc[2]/100)+'.');
    return rep('No te pillé. Prueba: linterna, saca una foto, contactos, dónde estoy, o temporizador de cinco minutos.')}

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  function mkrec(){if(!SR)return null;const r=new SR();r.lang='es-ES';r.continuous=false;r.interimResults=true;
    r.onstart=()=>{S.listening=true;$('micb').classList.add('live');$('dot').className='dot busy';
      if(navigator.vibrate)navigator.vibrate(25)};
    r.onresult=e=>{let t='',f=false;
      for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)f=true}
      inp.value=t.trim();if(f){const v=inp.value;inp.value='';handle(v)}};
    r.onerror=e=>{const m={'not-allowed':'permiso denegado','service-not-allowed':'servicio no disponible',
      'no-speech':'no oí nada','audio-capture':'sin micrófono'};add('Micrófono: '+(m[e.error]||e.error)+'.','s')};
    r.onend=()=>{S.listening=false;$('micb').classList.remove('live');$('dot').className='dot'};return r}

  $('send').onclick=()=>{const v=inp.value.trim();if(v){inp.value='';handle(v)}};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('send').click()}});
  $('micb').onclick=async()=>{if(!S.rec){S.rec=mkrec();if(!S.rec)return add('Sin dictado en este navegador.','s')}
    if(S.listening){try{S.rec.stop()}catch(e){}return}
    await audio();try{S.rec.start()}catch(e){try{S.rec.stop();setTimeout(()=>S.rec.start(),150)}catch(_){}}};

  ['qué hora es','linterna','saca una foto','contactos','dónde estoy','temporizador de 5 minutos','lee mis notas','estado','chiste']
    .forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;
      b.onclick=()=>handle(c);$('chips').appendChild(b)});

  let dp=null;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
  $('inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null}
    else add('Usa el menú de Chrome: Añadir a pantalla de inicio.','s')};

  if(navigator.getBattery)navigator.getBattery().then(b=>{window.__b=b});
  rs();requestAnimationFrame(draw);pump();
  add('Núcleo en línea. '+CAPS.filter(c=>c[1]).length+' de '+CAPS.length+' módulos disponibles.','s');
  setTimeout(()=>say('Buenos días. Sistemas operativos.'),400);
  $('note').textContent='Todo se ejecuta en tu teléfono. Nada sale a ningún servidor.';
})();
</script>
</body>
</html>
