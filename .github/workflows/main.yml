<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020914">
<title>J.A.R.V.I.S.</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: radial-gradient(ellipse at center, #082442 0%, #020914 65%, #000 100%);
    color: #00eaff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

.app {
    max-width: 500px;
    min-height: 100vh;
    margin: auto;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #00eaff55;
    padding-bottom: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #00eaff;
}

.status {
    font-size: 11px;
    color: #00ff9d;
}

.orb {
    width: 225px;
    height: 225px;
    margin: 45px auto 25px;
    border: 2px solid #00eaff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 0 25px #00bfff55,
                inset 0 0 30px #00bfff33;
    animation: pulse 3s infinite;
}

.orb::before,
.orb::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px dashed #00eaff99;
}

.orb::before {
    inset: 12px;
    animation: rotate 12s linear infinite;
}

.orb::after {
    inset: 30px;
    border-style: solid;
    border-color: #008cff;
    animation: rotate 7s linear infinite reverse;
}

.orb-core {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, #00eaff, #0065a8 45%, #00142b 75%);
    border-radius: 50%;
    box-shadow: 0 0 35px #00eaff;
    z-index: 1;
}

.listening .orb {
    animation: pulseFast 0.7s infinite;
    box-shadow: 0 0 45px #00ff9d;
    border-color: #00ff9d;
}

.listening .orb-core {
    background: radial-gradient(circle, #aaffee, #00ff9d 40%, #003b36 80%);
    box-shadow: 0 0 40px #00ff9d;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
}

@keyframes pulseFast {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
}

h2 {
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.subtitle {
    color: #8abed5;
    font-size: 13px;
    text-align: center;
    margin-bottom: 25px;
}

.panel {
    width: 100%;
    border: 1px solid #00eaff55;
    background: #041526bb;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
    box-shadow: 0 0 15px #00aaff11;
}

.label {
    color: #00eaff;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 9px;
}

.message {
    color: #d9f7ff;
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    min-height: 25px;
}

.controls {
    width: 100%;
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

button {
    border: 1px solid #00eaff;
    background: #06233a;
    color: #00eaff;
    padding: 15px 10px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    flex: 1;
    transition: 0.2s;
}

button:active {
    transform: scale(0.96);
}

button:hover {
    background: #0a3855;
}

#micButton {
    background: linear-gradient(135deg, #007ca8, #004c86);
    color: white;
    border: 1px solid #00eaff;
    box-shadow: 0 0 15px #00eaff44;
}

#micButton.active {
    background: linear-gradient(135deg, #00a879, #005b45);
    border-color: #00ff9d;
    color: white;
}

.input-area {
    display: flex;
    width: 100%;
    gap: 8px;
}

input {
    min-width: 0;
    flex: 1;
    padding: 14px;
    border: 1px solid #00eaff66;
    background: #03111f;
    color: white;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #00eaff;
}

#sendButton {
    flex: 0 0 75px;
}

.footer {
    margin-top: auto;
    padding-top: 25px;
    color: #477b96;
    font-size: 10px;
    letter-spacing: 2px;
    text-align: center;
}
</style>
</head>

<body>
<div class="app" id="app">

    <header class="header">
        <div class="logo">J.A.R.V.I.S.</div>
        <div class="status" id="status">● ONLINE</div>
    </header>

    <div class="orb">
        <div class="orb-core"></div>
    </div>

    <h2>ASSISTENTE VIRTUAL</h2>
    <p class="subtitle" id="subtitle">
        Sistema de inteligência artificial inicializado.
    </p>

    <div class="panel">
        <div class="label">ESTADO DO SISTEMA</div>
        <div class="message" id="systemMessage">
            Pronto para receber comandos.
        </div>
    </div>

    <div class="panel">
        <div class="label">VOCÊ DISSE</div>
        <div class="message" id="userMessage">
            Aguardando sua voz...
        </div>
    </div>

    <div class="panel">
        <div class="label">RESPOSTA DO JARVIS</div>
        <div class="message" id="jarvisMessage">
            Olá! Sou o J.A.R.V.I.S. Como posso ajudar?
        </div>
    </div>

    <div class="controls">
        <button id="micButton" onclick="toggleListening()">
            🎙 FALAR COM JARVIS
        </button>

        <button onclick="stopSpeaking()">
            🔇 SILENCIAR
        </button>
    </div>

    <div class="input-area">
        <input
            id="commandInput"
            type="text"
            placeholder="Digite um comando..."
            autocomplete="off"
        >
        <button id="sendButton" onclick="sendCommand()">
            ENVIAR
        </button>
    </div>

    <div class="footer">
        J.A.R.V.I.S. INTERFACE • VOICE SYSTEM
    </div>
</div>

<script>
const app = document.getElementById("app");
const statusText = document.getElementById("status");
const subtitle = document.getElementById("subtitle");
const systemMessage = document.getElementById("systemMessage");
const userMessage = document.getElementById("userMessage");
const jarvisMessage = document.getElementById("jarvisMessage");
const micButton = document.getElementById("micButton");
const commandInput = document.getElementById("commandInput");

let recognition = null;
let listening = false;
let speaking = false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

function speak(text) {
    if (!("speechSynthesis" in window)) {
        systemMessage.textContent =
            "A síntese de voz não está disponível neste navegador.";
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "pt-BR";
    utterance.rate = 1;
    utterance.pitch = 0.95;
    utterance.volume = 1;

    const voices = window.speechSynthesis.getVoices();

    const portugueseVoice = voices.find(voice =>
        voice.lang.toLowerCase().startsWith("pt-br")
    ) || voices.find(voice =>
        voice.lang.toLowerCase().startsWith("pt")
    );

    if (portugueseVoice) {
        utterance.voice = portugueseVoice;
    }

    utterance.onstart = () => {
        speaking = true;
        statusText.textContent = "● FALANDO";
        subtitle.textContent = "Transmitindo resposta de voz...";
    };

    utterance.onend = () => {
        speaking = false;
        statusText.textContent = listening
            ? "● ESCUTANDO"
            : "● ONLINE";

        subtitle.textContent = listening
            ? "Estou ouvindo você."
            : "Aguardando próximo comando.";
    };

    utterance.onerror = () => {
        speaking = false;
        statusText.textContent = "● ONLINE";
    };

    window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {
    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }

    speaking = false;
    statusText.textContent = listening
        ? "● ESCUTANDO"
        : "● ONLINE";

    systemMessage.textContent = "Voz interrompida.";
}

function initializeRecognition() {
    if (!SpeechRecognition) {
        systemMessage.textContent =
            "Reconhecimento de voz indisponível. Abra esta página no Google Chrome e verifique a conexão com a internet.";

        return false;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "pt-BR";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        listening = true;
        app.classList.add("listening");
        micButton.classList.add("active");
        micButton.textContent = "🔴 ESTOU OUVINDO";
        statusText.textContent = "● ESCUTANDO";
        systemMessage.textContent = "Pode falar. Estou ouvindo.";
        subtitle.textContent = "Fale seu comando em português.";
    };

    recognition.onresult = event => {
        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {
            transcript += event.results[i][0].transcript;
        }

        userMessage.textContent = transcript;

        const lastResult =
            event.results[event.results.length - 1];

        if (lastResult.isFinal) {
            processCommand(transcript);
        }
    };

    recognition.onerror = event => {
        systemMessage.textContent =
            event.error === "not-allowed"
                ? "Permita o acesso ao microfone nas configurações do navegador."
                : event.error === "no-speech"
                ? "Não detectei sua voz. Tente falar novamente."
                : "Erro no reconhecimento de voz: " + event.error;
    };

    recognition.onend = () => {
        listening = false;
        app.classList.remove("listening");
        micButton.classList.remove("active");
        micButton.textContent = "🎙 FALAR COM JARVIS";
        statusText.textContent = speaking
            ? "● FALANDO"
            : "● ONLINE";
    };

    return true;
}

function toggleListening() {
    if (!recognition && !initializeRecognition()) {
        speak("O reconhecimento de voz não está disponível neste navegador.");
        return;
    }

    if (listening) {
        recognition.stop();
        return;
    }

    try {
        window.speechSynthesis.cancel();
        recognition.start();
    } catch (error) {
        systemMessage.textContent =
            "Não consegui iniciar o microfone. Tente novamente.";
    }
}

function processCommand(rawText) {
    const text = rawText.toLowerCase().trim();

    if (!text) return;

    let response = "";

    if (
        text.includes("olá") ||
        text.includes("oi jarvis") ||
        text.includes("oi, jarvis") ||
        text.includes("bom dia") ||
        text.includes("boa tarde") ||
        text.includes("boa noite")
    ) {
        response = "Olá! Estou funcionando perfeitamente. Como posso ajudar?";
    }

    else if (
        text.includes("seu nome") ||
        text.includes("quem é você")
    ) {
        response = "Sou o J.A.R.V.I.S., seu assistente virtual.";
    }

    else if (
        text.includes("que horas") ||
        text.includes("hora agora")
    ) {
        response = "Agora são " +
            new Date().toLocaleTimeString("pt-BR", {
                hour: "2-digit",
                minute: "2-digit"
            }) + ".";
    }

    else if (text.includes("data de hoje") || text.includes("que dia é hoje")) {
        response = "Hoje é " +
            new Date().toLocaleDateString("pt-BR", {
                weekday: "long",
                day: "numeric
