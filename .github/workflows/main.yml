<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06131d">
<title>J.A.R.V.I.S.</title>

<style>
:root {
  color-scheme: dark;
  --cyan: #42e8ff;
  --bg: #06131d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(
    ellipse at center,
    #10364a 0,
    #06131d 55%,
    #02080d 100%
  );
  color: #d9faff;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.app {
  width: min(100%, 620px);
  text-align: center;
}

h1 {
  font-size: clamp(2rem, 8vw, 3.5rem);
  letter-spacing: .22em;
  color: var(--cyan);
  text-shadow: 0 0 18px #168bba;
  margin: 8px 0;
}

.subtitle {
  letter-spacing: .16em;
  color: #80bdca;
  font-size: .75rem;
  margin-bottom: 24px;
}

.orb {
  width: clamp(150px, 45vw, 220px);
  aspect-ratio: 1;
  margin: 20px auto 26px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  box-shadow: 0 0 18px #168bba, inset 0 0 25px #168bba;
  display: grid;
  place-items: center;
  position: relative;
  background: radial-gradient(
    circle,
    #1c6b82 0,
    #0b2635 48%,
    #06131d 72%
  );
  animation: pulse 3s infinite;
}

.orb::before,
.orb::after {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px solid #42e8ff88;
  border-radius: 50%;
  transform: rotateX(65deg) rotate(20deg);
}

.orb::after {
  inset: 25px;
  transform: rotateX(65deg) rotate(-35deg);
}

.orb span {
  font-size: 2.5rem;
  color: var(--cyan);
  text-shadow: 0 0 15px var(--cyan);
  z-index: 1;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 32px #168bba, inset 0 0 36px #168bba;
  }
}

.status {
  min-height: 24px;
  color: var(--cyan);
  margin: 10px 0;
}

.panel {
  background: #071923cc;
  border: 1px solid #168bba;
  border-radius: 14px;
  padding: 16px;
  text-align: left;
  box-shadow: 0 0 20px #001018;
  margin: 18px 0;
}

.label {
  font-size: .75rem;
  color: #6fb4c5;
  letter-spacing: .12em;
  margin-bottom: 8px;
}

#answer {
  white-space: pre-wrap;
  line-height: 1.5;
  min-height: 44px;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 18px 0;
}

button {
  border: 1px solid var(--cyan);
  border-radius: 9px;
  background: #0b3040;
  color: #e5fcff;
  padding: 12px 16px;
  font-weight: bold;
  font-size: .95rem;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

button.primary {
  background: #087ca0;
}

.inputrow {
  display: flex;
  gap: 8px;
}

input {
  min-width: 0;
  flex: 1;
  border: 1px solid #24718a;
  background: #06131d;
  color: white;
  border-radius: 9px;
  padding: 12px;
  font-size: 1rem;
}

.note {
  font-size: .8rem;
  line-height: 1.5;
  color: #8cb7c2;
  margin-top: 20px;
}
</style>
</head>

<body>
<main class="app">

  <h1>J.A.R.V.I.S.</h1>

  <div class="subtitle">
    SISTEMA DE ASSISTÊNCIA PESSOAL
  </div>

  <div class="orb" aria-hidden="true">
    <span>J</span>
  </div>

  <div id="status" class="status" role="status">
    Sistema pronto.
  </div>

  <section class="panel">
    <div class="label">RESPOSTA DO JARVIS</div>

    <div id="answer">
      Olá! Sou o JARVIS. Toque em Falar e diga um comando, ou escreva abaixo.
    </div>
  </section>

  <div class="controls">
    <button class="primary" id="listenBtn" type="button">
      🎙️ Falar
    </button>

    <button id="stopBtn" type="button">
      🔇 Parar voz
    </button>

    <button id="testBtn" type="button">
      🔊 Testar voz
    </button>
  </div>

  <form id="commandForm" class="inputrow">
    <input
      id="commandInput"
      type="text"
      placeholder="Digite um comando..."
      autocomplete="off"
      aria-label="Comando"
    >

    <button class="primary" type="submit">
      Enviar
    </button>
  </form>

  <p class="note">
    O reconhecimento de voz depende do navegador e da permissão do microfone.
    No Android, tente usar o Chrome e permita o microfone.
    A escuta pode precisar ser iniciada novamente após cada comando.
  </p>

</main>

